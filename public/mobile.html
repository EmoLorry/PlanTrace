<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PlanTrace Mobile</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f0e9;
      --ink: #29231f;
      --muted: #8c7b6d;
      --line: rgba(63, 45, 31, .1);
      --panel: rgba(255, 255, 255, .82);
      --soft: rgba(255, 255, 255, .56);
      --accent: #e87932;
      --amber: #e5a130;
      --green: #47a36c;
      --blue: #3b75d6;
      --red: #d8564b;
      --body-start: #fbf8f3;
      --glow-a: rgba(232, 121, 50, .22);
      --glow-b: rgba(59, 117, 214, .16);
      --topbar-strong: rgba(246, 240, 233, .98);
      --topbar-soft: rgba(246, 240, 233, .84);
      --sheet: #fffaf5;
      --field: rgba(255,255,255,.7);
      --tile: rgba(255,255,255,.58);
      --button-bg: rgba(255,255,255,.72);
      --note-bg: rgba(255,255,255,.58);
      --orbit-bg: rgba(255,255,255,.4);
      --note-ink: #5f5147;
      --active-bg: #29231f;
      --active-ink: #ffffff;
      --active-muted: rgba(255,255,255,.7);
      --atomic-bg: rgba(38, 31, 27, .92);
      --accent-soft: rgba(232,121,50,.1);
      --accent-glow: rgba(232,121,50,.24);
      --tag-text: #9c592d;
      --mark-a: #f3974d;
      --mark-b: #3d77d9;
      --shadow: 0 18px 44px rgba(74, 56, 38, .14);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% -10%, var(--glow-a), transparent 34%),
        radial-gradient(circle at 92% 3%, var(--glow-b), transparent 32%),
        linear-gradient(180deg, var(--body-start), var(--bg));
      color: var(--ink);
      padding-bottom: calc(146px + env(safe-area-inset-bottom));
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 12px 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      margin: -2px -4px 10px;
      padding: 6px 4px 10px;
      background: linear-gradient(180deg, var(--topbar-strong), var(--topbar-soft));
      backdrop-filter: blur(16px);
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px 10px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mark { width: 36px; height: 36px; border-radius: 13px; background: linear-gradient(135deg, var(--mark-a), var(--mark-b)); box-shadow: 0 12px 30px var(--accent-glow); }
    h1 { font-size: 17px; margin: 0; letter-spacing: 0; }
    .subtitle { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .icon-row { display: flex; gap: 6px; }
    .icon-btn {
      width: 34px; height: 34px; border: 0; border-radius: 12px;
      color: var(--ink); background: var(--button-bg);
      box-shadow: inset 0 0 0 1px var(--line);
      display: grid; place-items: center;
    }
    .dates {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(58px, 1fr);
      gap: 7px;
      overflow-x: auto;
      padding: 0 2px 2px;
      scrollbar-width: none;
    }
    .dates::-webkit-scrollbar { display: none; }
    .date-btn {
      border: 1px solid var(--line);
      background: var(--tile);
      min-height: 56px;
      border-radius: 15px;
      color: var(--muted);
      padding: 7px 8px;
      text-align: left;
      position: relative;
    }
    .date-btn strong { display: block; color: var(--ink); font-size: 18px; line-height: 1; }
    .date-btn span { font-size: 10px; }
    .date-btn.active { background: var(--active-bg); color: var(--active-muted); border-color: var(--active-bg); box-shadow: var(--shadow); }
    .date-btn.active strong { color: var(--active-ink); }
    .date-dot { position: absolute; right: 8px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .date-dot.done { background: var(--green); }
    .date-dot.late { background: #b9afa6; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 10px 0 12px; }
    .tab {
      height: 38px; border: 0; border-radius: 13px; background: var(--tile);
      color: var(--muted); font-weight: 800; font-size: 13px;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .tab.active { background: var(--accent); color: white; box-shadow: 0 12px 28px var(--accent-glow); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .section { padding: 14px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .add-row { display: flex; gap: 8px; }
    .input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--field);
      border-radius: 13px;
      color: var(--ink);
      outline: none;
      padding: 11px 12px;
    }
    textarea { min-height: 210px; resize: vertical; line-height: 1.62; }
    .primary {
      border: 0; border-radius: 13px; background: var(--accent); color: white;
      font-weight: 900; padding: 0 15px; box-shadow: 0 12px 28px var(--accent-glow);
    }
    .task { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .task:last-child { border-bottom: 0; }
    .check {
      width: 32px; height: 32px; border-radius: 11px; border: 0;
      background: var(--accent-soft); color: var(--accent); font-weight: 900;
    }
    .check.done { background: rgba(71,163,108,.12); color: var(--green); }
    .task-title { font-size: 14px; font-weight: 850; line-height: 1.35; overflow-wrap: anywhere; }
    .task-title.done { color: var(--muted); text-decoration: line-through; }
    .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .tag { font-size: 10px; color: var(--tag-text); background: var(--accent-soft); padding: 3px 7px; border-radius: 999px; }
    .tag.green { color: var(--green); background: rgba(71,163,108,.12); }
    .task-actions { display: flex; gap: 5px; }
    .mini {
      width: 32px; height: 32px; border: 0; border-radius: 11px;
      background: var(--button-bg); color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .mini.hot { color: var(--amber); background: rgba(229,161,48,.12); }
    .mini.danger { color: var(--red); }
    .empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 13px; }
    .notes { display: grid; gap: 9px; margin-top: 12px; }
    .note { border: 1px solid var(--line); background: var(--note-bg); border-radius: 13px; padding: 10px; color: var(--note-ink); line-height: 1.52; white-space: pre-wrap; }
    .star-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .stat { border: 1px solid var(--line); background: var(--soft); border-radius: 15px; padding: 12px; }
    .stat strong { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .orbit { height: 240px; position: relative; overflow: hidden; border-radius: 16px; background: radial-gradient(circle at center, var(--accent-soft), transparent 45%), var(--orbit-bg); }
    .star-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent-glow); }
    .atomic {
      position: fixed;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 50;
      width: min(536px, calc(100vw - 20px));
      background: var(--atomic-bg);
      color: white;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.24);
      padding: 12px;
      backdrop-filter: blur(18px);
    }
    .atomic-row { display: grid; grid-template-columns: minmax(0, 1fr) 68px 56px; gap: 8px; align-items: center; }
    .atomic input { min-width: 0; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.09); color: white; border-radius: 12px; padding: 10px; outline: none; }
    .atomic input::placeholder { color: rgba(255,255,255,.42); }
    .atomic button { border: 0; border-radius: 12px; background: var(--accent); color: white; font-weight: 900; height: 39px; }
    .atomic button.stop { background: var(--red); }
    .atomic-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: rgba(255,255,255,.7); }
    .atomic-time { color: white; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .sheet { display: none; position: fixed; inset: 0; z-index: 80; background: rgba(30,22,16,.28); backdrop-filter: blur(8px); align-items: flex-end; }
    .sheet.open { display: flex; }
    .sheet-card { width: 100%; max-width: 560px; margin: 0 auto; background: var(--sheet); border-radius: 22px 22px 0 0; padding: 16px; box-shadow: 0 -16px 50px rgba(0,0,0,.18); }
    .sheet-actions { display: grid; gap: 9px; margin-top: 12px; }
    .sheet-actions button { height: 44px; border: 0; border-radius: 13px; background: var(--accent-soft); color: var(--ink); font-weight: 850; }
    .video-wrap { display: none; margin-top: 12px; padding: 8px; background: #111; border-radius: 15px; }
    video { display: block; width: 100%; border-radius: 10px; }
    .progress { height: 7px; background: rgba(0,0,0,.08); border-radius: 999px; overflow: hidden; margin-top: 11px; }
    .progress span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .16s ease; }
    .status { color: var(--muted); font-size: 12px; min-height: 18px; line-height: 1.45; margin-top: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="mark"></div>
          <div>
            <h1>PlanTrace Mobile</h1>
            <div class="subtitle" id="subtitle">手机本地模式</div>
          </div>
        </div>
        <div class="icon-row">
          <button class="icon-btn" id="theme-btn" title="切换主题">◐</button>
          <button class="icon-btn" id="today-btn" title="Today">今</button>
          <button class="icon-btn" id="sync-btn" title="Import / Export">⇅</button>
          <button class="icon-btn" id="export-btn" title="Export">⇩</button>
        </div>
      </div>
      <div class="dates" id="dates"></div>
      <div class="tabs">
        <button class="tab active" data-tab="tasks">任务</button>
        <button class="tab" data-tab="diary">日记</button>
        <button class="tab" data-tab="star">星图</button>
      </div>
    </div>

    <section class="panel" id="tasks-view">
      <div class="section">
        <div class="add-row">
          <input class="input" id="task-input" placeholder="给这一天加一个任务..." />
          <button class="primary" id="add-task-btn">加</button>
        </div>
      </div>
      <div class="section" id="task-list"></div>
    </section>

    <section class="panel hidden" id="diary-view">
      <div class="section">
        <textarea id="diary-main" placeholder="今天发生了什么..."></textarea>
      </div>
      <div class="section">
        <button class="primary" id="add-note-btn" style="height:40px;">新增碎碎念</button>
        <div class="notes" id="notes"></div>
      </div>
    </section>

    <section class="panel hidden" id="star-view">
      <div class="section">
        <div class="star-grid">
          <div class="stat"><strong id="stat-tasks">0</strong><span>任务</span></div>
          <div class="stat"><strong id="stat-hammers">0</strong><span>Hammer</span></div>
          <div class="stat"><strong id="stat-minutes">0</strong><span>分钟投入</span></div>
          <div class="stat"><strong id="stat-diaries">0</strong><span>日记</span></div>
        </div>
      </div>
      <div class="section">
        <div class="orbit" id="orbit"></div>
      </div>
    </section>
  </main>

  <section class="atomic">
    <div class="atomic-meta">
      <span>Atomic Timer</span>
      <span class="atomic-time" id="atomic-time">00:00</span>
    </div>
    <div class="atomic-row">
      <input id="atomic-label" placeholder="专注内容" />
      <input id="atomic-minutes" type="number" min="1" max="999" value="25" />
      <button id="atomic-btn">开始</button>
    </div>
  </section>

  <section class="sheet" id="sync-sheet">
    <div class="sheet-card">
      <h2 style="font-size:16px;margin:0;">数据导入 / 导出</h2>
      <div class="status" id="sync-status">可导入电脑端 Backup Data 或 Mobile Sync 数据包。</div>
      <input id="file-input" type="file" accept="application/json,.json" hidden />
      <div class="sheet-actions">
        <button id="file-btn">导入 JSON 文件</button>
        <button id="scan-btn">扫描 Mobile Sync 二维码</button>
        <button id="close-sheet-btn">关闭</button>
      </div>
      <div class="video-wrap" id="video-wrap">
        <video id="video" playsinline muted></video>
      </div>
      <div class="progress"><span id="scan-progress"></span></div>
    </div>
  </section>

        row.querySelector('[data-act="delete"]').onclick = () => deleteTaskDate(task.id);
        els.taskList.appendChild(row);
      });
    }
    function renderDiary() {
      const diary = currentDiary(false);
      els.diaryMain.value = diary?.mainText || '';
      const notes = Array.isArray(diary?.notes) ? diary.notes : [];
      els.notes.innerHTML = notes.length ? '' : '<div class="empty">还没有碎碎念。</div>';
      notes.forEach((note) => {
        const div = document.createElement('div');
        div.className = 'note';
        div.innerHTML = `${escapeHtml(note.text)}<div style="text-align:right;margin-top:7px;"><button class="mini danger">×</button></div>`;
        div.querySelector('button').onclick = () => removeNote(note.id);
        els.notes.appendChild(div);
      });
    }
    function renderStar() {
      const totalMinutes = tasks().reduce((sum, task) => sum + Object.values(task.time_spent || {}).reduce((a, b) => a + Number(b || 0), 0), 0);
      els.statTasks.textContent = tasks().filter((task) => task.status !== 'deleted').length;
      els.statHammers.textContent = logs().filter((log) => log.action_type === 'HAMMER').length;
      els.statMinutes.textContent = Math.round(totalMinutes / 60);
      els.statDiaries.textContent = diaries().filter((entry) => entry.diary?.mainText || entry.diary?.notes?.length).length;
      els.orbit.innerHTML = '';
      const visible = tasks().filter((task) => task.status !== 'deleted').slice(0, 80);
      visible.forEach((task, i) => {
        const angle = (i / Math.max(1, visible.length)) * Math.PI * 2;
        const radius = 28 + (i % 5) * 8;
        const x = 50 + Math.cos(angle) * radius;
        const y = 50 + Math.sin(angle) * radius * .72;
        const dot = document.createElement('div');
        dot.className = 'star-dot';
        dot.style.left = `${x}%`;
        dot.style.top = `${y}%`;
        dot.title = task.content;
        els.orbit.appendChild(dot);
      });
    }
    function renderAtomic() {
      const active = activeAtomic();
      if (!active) {
        els.atomicBtn.textContent = '开始';
        els.atomicBtn.classList.remove('stop');
        els.atomicTime.textContent = '00:00';
        return;
      }
      const elapsed = Math.floor((Date.now() - active.started_at) / 1000);
      els.atomicTime.textContent = formatSeconds(elapsed);
      els.atomicBtn.textContent = '停止';
      els.atomicBtn.classList.add('stop');
    }
    function render() {
      els.subtitle.textContent = `${tasks().length} tasks · ${logs().length} logs`;
      document.querySelectorAll('.tab').forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === state.tab));
      el('tasks-view').classList.toggle('hidden', state.tab !== 'tasks');
      el('diary-view').classList.toggle('hidden', state.tab !== 'diary');
      el('star-view').classList.toggle('hidden', state.tab !== 'star');
      renderDates();
      renderTasks();
      renderDiary();
      renderStar();
      renderAtomic();
    }
    function toggleAtomic() {
      const active = activeAtomic();
      if (active) {
        const ended = Date.now();
        sessions().push({
          session_id: id('atomic'),
          label: active.label || '专注时间',
          planned_seconds: active.planned_seconds,
          started_at: active.started_at,
          ended_at: ended,
          status: 'completed',
          date: nowBJDate(active.started_at),
        });
        setActiveAtomic(null);
        save();
      } else {
        const minutes = Math.max(1, Number(els.atomicMinutes.value) || 25);
        setActiveAtomic({
          label: els.atomicLabel.value.trim() || '专注时间',
          planned_seconds: minutes * 60,
          started_at: Date.now(),
        });
      }
      render();
    }
    function exportJson() {
      save();
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `plantrace_mobile_${todayBJ()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function setSyncStatus(text) { els.syncStatus.textContent = text; }
    function base64UrlToBytes(value) {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((value.length + 3) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    async function unpackEncoded(encoded) {
      const kind = encoded.slice(0, 2);
      const bytes = base64UrlToBytes(encoded.slice(2));
      if (kind === 'G.') {
        if (!('DecompressionStream' in window)) throw new Error('当前浏览器不支持 gzip 解压，请使用 JSON 导入。');
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return JSON.parse(await new Response(stream).text());
      }
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    async function importText(text) {
      const stats = mergeDataPack(JSON.parse(text));
      state.selectedDate = todayBJ();
      if (!activeDates().includes(state.selectedDate)) state.selectedDate = activeDates()[0] || todayBJ();
      render();
      setSyncStatus(`合并完成：任务 ${stats.tasks}，日志 ${stats.logs}，日记 ${stats.diaries}。`);
    }
    function handleFrame(rawValue) {
      const parts = String(rawValue || '').split('|');
      if (parts.length < 5 || parts[0] !== 'PT1') return;
      const idValue = parts[1];
      const index = parseInt(parts[2], 36);
      const total = parseInt(parts[3], 36);
      const chunk = parts.slice(4).join('|');
      if (!Number.isFinite(index) || !Number.isFinite(total) || index < 0 || index >= total) return;
      if (!scanState || scanState.id !== idValue || scanState.total !== total) {
        scanState = { id: idValue, total, chunks: Array(total).fill('') };
      }
      scanState.chunks[index] = chunk;
      const got = scanState.chunks.filter(Boolean).length;
      els.scanProgress.style.width = `${Math.round((got / total) * 100)}%`;
      setSyncStatus(`正在接收：${got} / ${total}`);
      if (got === total) {
        const encoded = scanState.chunks.join('');
        scanState = null;
        stopScanner();
        unpackEncoded(encoded).then((pack) => importText(JSON.stringify(pack))).catch((err) => setSyncStatus(err.message || '导入失败。'));
      }
    }
    async function scanLoop() {
      if (!scanning || !detector) return;
      try {
        const codes = await detector.detect(els.video);
        if (codes.length) handleFrame(codes[0].rawValue);
      } catch {}
      requestAnimationFrame(scanLoop);
    }
    async function startScanner() {
      if (!('BarcodeDetector' in window)) {
        setSyncStatus('当前浏览器不支持原生二维码识别，请使用 JSON 导入。');
        return;
      }
      try {
        detector = new BarcodeDetector({ formats: ['qr_code'] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        els.video.srcObject = stream;
        await els.video.play();
        els.videoWrap.style.display = 'block';
        scanning = true;
        scanLoop();
      } catch (err) {
        setSyncStatus(err.message || '无法打开摄像头。');
      }
    }
    function stopScanner() {
      scanning = false;
      if (stream) stream.getTracks().forEach((track) => track.stop());
      stream = null;
      els.videoWrap.style.display = 'none';
    }
    function bind() {
      el('add-task-btn').onclick = addTask;
      els.taskInput.onkeydown = (e) => { if (e.key === 'Enter') addTask(); };
      els.diaryMain.oninput = saveDiary;
      el('add-note-btn').onclick = addNote;
      el('theme-btn').onclick = cycleTheme;
      el('today-btn').onclick = () => { state.selectedDate = todayBJ(); render(); };
      el('sync-btn').onclick = () => els.syncSheet.classList.add('open');
      el('export-btn').onclick = exportJson;
      el('close-sheet-btn').onclick = () => { stopScanner(); els.syncSheet.classList.remove('open'); };
      el('file-btn').onclick = () => els.fileInput.click();
      el('scan-btn').onclick = () => scanning ? stopScanner() : startScanner();
      els.fileInput.onchange = async () => {
        const file = els.fileInput.files?.[0];
        if (!file) return;
        try { await importText(await file.text()); } catch (err) { setSyncStatus(err.message || '导入失败。'); }
        els.fileInput.value = '';
      };
      document.querySelectorAll('.tab').forEach((btn) => {
        btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
      });
      els.atomicBtn.onclick = toggleAtomic;
      setInterval(() => {
        const map = activeHammerMap();
        Object.entries(map).forEach(([taskId, start]) => {
          const boundary = nextMidnightBJ(start);
          if (Date.now() >= boundary) {
            recordHammer(taskId, start, boundary);
            map[taskId] = boundary;
          }
        });
        setActiveHammerMap(map);
        renderTasks();
        renderAtomic();
      }, 1000);
    }
    load();
    applyTheme(localStorage.getItem(THEME_KEY) || state.data.keys.theme || currentThemeId, { persist: false });
    bind();
    render();
  </script>
</body>
</html>
